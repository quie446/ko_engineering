name: Reproducible Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:

  reproducible:
    name: Lock File and Reproducible Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Build ko
        run: go build -o /tmp/ko .

      # Step 1: if the repo commits a ko.lock, it must match what the
      # configured base images currently resolve to.
      - name: Verify base image lock file
        run: |
          if [ -f ko.lock ]; then
            /tmp/ko lock --verify
          else
            echo "No ko.lock committed; skipping lock verification."
          fi

      # Step 2: two consecutive reproducible builds of the same commit must
      # produce the same image digest.
      - name: Build twice and compare digests
        run: KO=/tmp/ko hack/verify-reproducible.sh ./test
